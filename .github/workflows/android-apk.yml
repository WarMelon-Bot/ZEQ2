name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/27.3.13750724
      ANDROID_PLATFORM: android-35
      ANDROID_BUILD_TOOLS: 35.0.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Android NDK and zip
        run: |
          sdkmanager --install "ndk;27.3.13750724"
          sudo apt-get update && sudo apt-get install -y zip

      # Use the repository's maintained NativeActivity build.  The previous
      # generated Gradle project used an invalid android namespace URI (so the
      # manifest merger could not see android:* attributes) and globbed every
      # C file under Source/ into libmain.so, including host-only tools.
      - name: Build signed APK
        run: ./build.sh android

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify \
            --print-certs Source/Build/Android/ZEQ2-Lite-debug.apk
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt2" dump badging \
            Source/Build/Android/ZEQ2-Lite-debug.apk > /tmp/zeq2-badging.txt
          grep -q "package: name='com.zeq2.lite'" /tmp/zeq2-badging.txt
          grep -q "launchable-activity: name='android.app.NativeActivity'" /tmp/zeq2-badging.txt
          python3 - <<'PY'
          import zipfile

          apk = "Source/Build/Android/ZEQ2-Lite-debug.apk"
          with zipfile.ZipFile(apk) as zf:
              names = zf.namelist()

          assert "AndroidManifest.xml" in names, "APK is missing a manifest"
          assert any(n.startswith("lib/") and n.endswith("/libzeq2.so") for n in names), \
              "APK is missing the native library"
          assert any(n.startswith("assets/ZEQ2/") for n in names), \
              "APK is missing game assets"
          print(f"Verified {apk}: {len(names)} entries")
          PY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZEQ2-Lite-Android-Debug-APK
          path: Source/Build/Android/ZEQ2-Lite-debug.apk
          if-no-files-found: error
