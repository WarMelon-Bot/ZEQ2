name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Find Android Build Files
        run: |
          echo "=== Files in android/ ==="
          find android -maxdepth 3
          echo "=== Root build.sh ==="
          cat build.sh || true

      - name: Build Debug APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          GRADLE_FILE=$(find android -name "build.gradle*" | head -n 1)

          if [ -n "$GRADLEW_PATH" ]; then
            echo "Found gradlew at $GRADLEW_PATH"
            GRADLE_DIR=$(dirname "$GRADLEW_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -n "$GRADLE_FILE" ]; then
            echo "Found build.gradle at $GRADLE_FILE"
            GRADLE_DIR=$(dirname "$GRADLE_FILE")
            cd "$GRADLE_DIR"
            gradle assembleDebug
          else
            echo "No Gradle project found in android/ — check Find Android Build Files output"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZEQ2-Android-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
          archive: false
          if-no-files-found: error
