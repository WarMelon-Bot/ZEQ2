name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Show Existing Android Files
        run: |
          find android -maxdepth 4

      - name: Build Debug APK
        working-directory: ./android
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle wrapper --gradle-version 8.5
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Print Manifest Merger Report on Failure
        if: failure()
        run: |
          find android -name "manifest-merger-*.txt" -exec cat {} + || true
          cat -n android/app/src/main/AndroidManifest.xml || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZEQ2-Android-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
          archive: false
          if-no-files-found: error
