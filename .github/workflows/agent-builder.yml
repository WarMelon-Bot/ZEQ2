name: Autonomous Build & Fix Agent (OpenCode)

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task for the agent'
        required: true
        default: 'Inspect the repo, update AGENTS.md with all build/test suites, compile, and fix any errors.'
      model:
        description: 'Preferred first model (auto-falls back through all free OpenCode models, then OpenRouter -> Gemini)'
        required: false
        default: 'opencode/big-pickle'
  issues:
    types: [opened]
  issue_comment:
    types: [created]

# Security: only what the agent actually needs, instead of write-all
permissions:
  contents: write
  issues: write
  pull-requests: write

# Cost/speed: cancel superseded runs (e.g. rapid comments on the same issue)
concurrency:
  group: agent-${{ github.event.issue.number || 'manual' }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.AGENT_PAT }}
  GH_TOKEN: ${{ secrets.AGENT_PAT }}

jobs:
  run-agent:
    # Guard against bot-triggered loops
    if: |
      github.actor != 'github-actions[bot]' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.sender.login == github.repository_owner &&
        contains(format('{0} {1}', github.event.issue.body, github.event.comment.body), '@agent'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.AGENT_PAT }}
          fetch-depth: 1            # shallow clone — the agent doesn't need history

      - name: Setup Node.js & Install OpenCode
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install OpenCode
        run: npm install -g @opencode/cli --no-audit --no-fund --loglevel=error

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global push.autoSetupRemote true

      - name: Run OpenCode Agent with Automatic Fallback
        timeout-minutes: 60         # hard ceiling so a hung model can't burn the whole quota
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCODE_PERMISSION: '{"*": "allow", "websearch": "deny", "question": "deny"}'
          OPENCODE_DISABLE_AUTOUPDATE: '1'   # skip update checks that can stall the run
          # Pass dynamic text via env — avoids YAML/bash quoting explosions and script injection
          PREFERRED_MODEL: ${{ github.event.inputs.model || 'opencode/big-pickle' }}
          INPUT_TASK: ${{ github.event.inputs.task }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -u

          # Single ordered list; preferred model goes first, duplicates removed
          ALL_MODELS=(
            "$PREFERRED_MODEL"
            opencode/big-pickle
            opencode/grok-code-fast-1
            opencode/kimi-k2p5
            opencode/mini
            opencode/mimo-v2p5
            opencode/qwen3-coder
            openrouter/openrouter/free
            google/gemini-3.8-flash
            mistral/codestral-latest
          )
          MODELS=($(printf '%s\n' "${ALL_MODELS[@]}" | awk '!seen[$0]++'))

          PROMPT="$(printf 'Follow AGENTS.md (including keeping AGENTS.md updated with all build commands and test suites) and complete this task:\nOriginal Issue: %s\nLatest Comment / Manual Task: %s' \
            "${ISSUE_BODY:-}" "${INPUT_TASK:-$COMMENT_BODY}")"

          for MODEL in "${MODELS[@]}"; do
            PHASE="OpenCode free tier"; [[ "$MODEL" != opencode/* ]] && PHASE="external providers"
            echo "=================================================="
            echo "Attempting run [$PHASE] with model: $MODEL"
            echo "=================================================="
            # timeout prevents one stuck model from eating the job's entire minute budget
            if timeout 900 opencode run -m "$MODEL" "$PROMPT"; then
              echo "Succeeded with model: $MODEL"
              exit 0
            fi
            echo "Model $MODEL failed, timed out, or hit rate limit. Falling back..."
            sleep 3
          done

          echo "All configured models failed or hit quota limits."
          exit 1

      - name: Rescue Uncommitted Changes into PR (Fallback)
        if: always()
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No uncommitted changes to rescue."
            exit 0
          fi
          BRANCH=$(git branch --show-current)
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "main" ]; then
            BRANCH="agent-fix-$(date +%s)"
            git switch -c "$BRANCH"
          fi
          git add -A
          git commit -m "chore: autonomous agent build, tests & AGENTS.md updates"
          git push -u origin "$BRANCH"
          gh pr create --title "Autonomous Agent Build & Fixes" \
            --body "Automated changes generated by OpenCode agent." \
            --base main --head "$BRANCH" || echo "PR may already exist."
