name: Autonomous Build & Fix Agent (OpenCode)

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task for the agent'
        required: true
        default: 'Inspect the repo, update AGENTS.md with all build/test suites, compile, and fix any errors.'
      model:
        description: 'Preferred first model (auto-falls back to OpenRouter -> Gemini -> OpenCode if rate-limited)'
        required: false
        default: 'mistral/codestral-latest'
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions: write-all

jobs:
  run-agent:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.sender.login == github.repository_owner &&
      contains(format('{0} {1}', github.event.issue.body, github.event.comment.body), '@agent'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.AGENT_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install OpenCode
        run: npm install -g @opencode/cli

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"

      - name: Run OpenCode Agent with Automatic Fallback
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT }}
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCODE_PERMISSION: '{"*": "allow", "websearch": "deny", "question": "deny"}'
        run: |
          PREFERRED="${{ github.event.inputs.model || 'mistral/codestral-latest' }}"
          MODELS=(
            "$PREFERRED"
            "openrouter/openrouter/free"
            "google/gemini-3.8-flash"
            "opencode/big-pickle"
          )

          PROMPT="Follow AGENTS.md (including keeping AGENTS.md updated with all build commands and test suites) and complete this task:
          Original Issue: ${{ github.event.issue.body }}
          Latest Comment / Manual Task: ${{ github.event.inputs.task || github.event.comment.body }}"

          SUCCESS=0
          for MODEL in "${MODELS[@]}"; do
            echo "=================================================="
            echo "Attempting run with model: $MODEL"
            echo "=================================================="
            if opencode run -m "$MODEL" "$PROMPT"; then
              echo "Succeeded with model: $MODEL"
              SUCCESS=1
              break
            else
              echo "Model $MODEL failed or hit rate limit. Falling back to next provider..."
              sleep 3
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "All configured models failed or hit quota limits."
            exit 1
          fi

      - name: Rescue Uncommitted Changes into PR (Fallback)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT }}
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            BRANCH=$(git branch --show-current)
            if [ -z "$BRANCH" ] || [ "$BRANCH" = "main" ]; then
              BRANCH="agent-fix-$(date +%s)"
              git checkout -b "$BRANCH"
            fi
            git add -A
            git commit -m "chore: autonomous agent build, tests & AGENTS.md updates"
            git push -u origin "$BRANCH"
            gh pr create --title "Autonomous Agent Build & Fixes" --body "Automated changes generated by OpenCode agent." --base main --head "$BRANCH" || true
          fi
