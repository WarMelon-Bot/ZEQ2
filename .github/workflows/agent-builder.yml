name: Autonomous Build & Fix Agent (OpenCode)

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task for the agent'
        required: true
        default: 'Inspect the repo, build a CLI/build script, compile, and fix any errors.'
      model:
        description: 'Provider/Model (e.g. openrouter/openrouter/free, cerebras/qwen-3-coder-480b, groq/llama-3.3-70b-versatile)'
        required: false
        default: 'openrouter/openrouter/free'
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions: write-all

jobs:
  run-agent:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.sender.login == github.repository_owner &&
      contains(format('{0} {1}', github.event.issue.body, github.event.comment.body), '@agent'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.AGENT_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install OpenCode
        run: npm install -g @opencode/cli

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"

      - name: Run OpenCode Agent
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT }}
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENCODE_PERMISSION: '{"*": "allow", "websearch": "deny", "question": "deny"}'
        run: |
          MODEL="${{ github.event.inputs.model || 'openrouter/openrouter/free' }}"
          opencode run -m "$MODEL" "Read the repository files and follow these instructions.
          Original Issue: ${{ github.event.issue.body }}
          Latest Comment / Manual Task: ${{ github.event.inputs.task || github.event.comment.body }}
          You have full repository permissions, including creating or editing .github/workflows files, pushing branches, and creating or merging Pull Requests. Do not use web search or ask questions. Build any CLI or build scripts needed, compile and run the source code, inspect all compiler or runtime errors, fix them, and verify the build succeeds cleanly. Finally, create a new git branch, commit your changes, push the branch, and open a Pull Request using the gh CLI."

      - name: Rescue Uncommitted Changes into PR (Fallback)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT }}
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            BRANCH="agent-fix-$(date +%s)"
            git checkout -b "$BRANCH"
            git add -A
            git commit -m "chore: autonomous agent build & fixes"
            git push -u origin "$BRANCH"
            gh pr create --title "Autonomous Agent Build & Fixes" --body "Automated changes generated by OpenCode agent." --base main --head "$BRANCH" || true
          fi
