name: Autonomous Build & Fix Agent (OpenCode)

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task for the agent'
        required: true
        default: 'Inspect the repo, build a CLI/build script, compile, and fix any errors.'
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-agent:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.sender.login == github.repository_owner &&
      contains(github.event.comment.body || github.event.issue.body, '@agent'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai | bash

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"

      - name: Run OpenCode Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH: /home/runner/.opencode/bin:${{ env.PATH }}
        run: |
          opencode models
          opencode run -m opencode/big-pickle "Read the repository files and follow these instructions.
          Original Issue: ${{ github.event.issue.body }}
          Latest Comment / Manual Task: ${{ github.event.inputs.task || github.event.comment.body }}
          Build any CLI or build scripts needed, compile and run the source code, inspect all compiler or runtime errors, fix them, and verify the build succeeds cleanly. Finally, create a new git branch, commit your changes, push the branch, and open a Pull Request using the gh CLI."
