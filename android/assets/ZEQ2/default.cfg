// ZEQ2-Lite Android defaults.
// These bindings match the packaged touch layout.  They can be changed from
// the normal controls menu or with the touch_bind console command.

set touch_enable 1
set touch_opacity 0.55
set touch_lookSensitivity 0.22
set r_texturebits 16
set r_picmip 1
set r_overBrightBits 0
set r_gamma 1
set cg_fov 90
set cl_freelook 1
set in_mouse 0
set vm_game 2
set vm_cgame 2
set vm_ui 2

// Movement stick.  WASD is included so sticks added in the layout editor work.
bind UPARROW "+forward"
bind DOWNARROW "+back"
bind , "+moveleft"
bind . "+moveright"
bind W "+forward"
bind S "+back"
bind A "+moveleft"
bind D "+moveright"

// Look stick is handled directly by the touch layer as relative mouse motion.

// Action buttons.
bind MOUSE1 "+attack"
bind MOUSE2 "+button10"
bind SHIFT "+speed"
bind SPACE "+button14"

// Hardware keyboard / gamepad conveniences.
bind TAB "+scores"
bind ENTER "+button2"
bind F1 "+zoom"
bind F2 "weapnext"
bind F3 "weapprev"
bind F4 "+button1"
bind F5 "+button12"
