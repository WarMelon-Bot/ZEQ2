// Optional command-line config loaded by NativeActivity after engine init.
// The packaged game bindings and touch layout live under ZEQ2/.
set touch_enable 1
set touch_opacity 0.55
set touch_lookSensitivity 0.22
set r_allowExtensions 1
set r_primitives 1
set r_texturebits 16
set r_finish 0
set s_volume 0
